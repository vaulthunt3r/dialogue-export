<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dialogue Export</title>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" width="30" height="30" alt="">
    <div><h1>Dialogue Export</h1><p id="status" role="status">Connecting to your conversation…</p></div>
  </header>
  <section id="activity" class="activity" hidden aria-label="Export status">
    <div class="activity-heading"><strong id="activityTitle"></strong><span id="elapsed"></span></div>
    <p id="activityDetail" role="status"></p>
    <div class="activity-track" aria-hidden="true"><span></span></div>
  </section>
  <form id="exportForm">
    <fieldset id="controls" disabled>
      <legend class="sr-only">Export settings</legend>
      <fieldset class="field">
        <legend>Messages</legend>
        <div class="segmented scope">
          <label><input type="radio" name="scope" value="all" checked><span>All messages</span></label>
          <label><input type="radio" name="scope" value="selected"><span>Selected</span></label>
        </div>
        <p id="scopeHint" class="hint">Earlier messages are loaded automatically.</p>
        <div id="selectionTools" hidden>
          <div class="selection-actions"><button id="selectionMode" type="button">Choose messages</button><button id="clearSelection" type="button" class="quiet" disabled>Clear</button></div>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend>Format</legend>
        <div class="segmented formats">
          <label class="format-txt"><input type="radio" name="format" value="txt"><span>TXT</span></label>
          <label class="format-md"><input type="radio" name="format" value="md" checked><span>MD</span></label>
          <label class="format-html"><input type="radio" name="format" value="html"><span>HTML</span></label>
          <label class="format-json"><input type="radio" name="format" value="json"><span>JSON</span></label>
          <label class="format-pdf"><input type="radio" name="format" value="pdf"><span>PDF</span></label>
        </div>
        <p id="formatHint" class="hint">Markdown · for notes and text editors.</p>
      </fieldset>
      <div class="field">
        <label for="filename">File name</label>
        <div class="filename-field"><input id="filename" type="text" maxlength="160" placeholder="conversation" autocomplete="off" spellcheck="false" aria-describedby="filenamePreview"><span id="extension" aria-hidden="true">.md</span></div>
        <p id="filenamePreview" class="filename-preview"></p>
      </div>
      <details class="options">
        <summary>Export options</summary>
        <label class="check"><input id="includeTitle" type="checkbox" checked><span>Title and date in the document</span></label>
        <label class="check"><input id="includeLinks" type="checkbox" checked><span>Keep links</span></label>
        <label class="check"><input id="appendDate" type="checkbox"><span>Add today’s date to the file name</span></label>
      </details>
    </fieldset>
    <div id="errorBox" class="error-box" hidden><p id="error" role="alert"></p><button id="retry" type="button" hidden>Try connecting again</button></div>
    <button id="exportButton" class="primary" type="submit" disabled><span id="exportLabel">Connecting…</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <p id="actionHint" class="action-hint">Choose your format, then export.</p>
  </form>
  <footer><span>Processed locally in your browser</span><span id="version"></span></footer>
  <script src="mock-browser.js"></script>
  <script src="../popup/popup.js"></script>
</body>
</html>

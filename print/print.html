<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF — Dialogue Export</title>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <aside class="toolbar">
    <div>
      <strong id="printStatus" role="status">Preparing your PDF layout…</strong>
      <span>Click the button, then choose “Save to PDF” in Firefox.</span>
      <span id="suggestedName" hidden></span>
    </div>
    <button id="printButton" type="button" disabled>Save as PDF</button>
  </aside>
  <p id="error" role="alert"></p>
  <div id="document"></div>
  <script src="print.js"></script>
</body>
</html>
